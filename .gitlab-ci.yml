# GitLab CI. GitLab shares scripts/ci-common.mjs with CNB and GitHub Actions.
#
# Images go to ${CI_REGISTRY}/${CI_REGISTRY_PATH} (executor) and
# ${CI_REGISTRY}/${CI_REGISTRY_PATH}/sandbox (sandbox).
# Merge requests validate only; they never push images.
stages:
  - verify
  - publish

variables:
  NODE_IMAGE: node:24.15.0-bookworm
  DOCKER_IMAGE: docker:28.6.1-cli
  DOCKER_DIND_IMAGE: docker:28.6.1-dind

default:
  interruptible: true

verify:
  stage: verify
  image: $NODE_IMAGE
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - node scripts/ci-common.mjs verify

publish:
  stage: publish
  image: $DOCKER_IMAGE
  services:
    - name: $DOCKER_DIND_IMAGE
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  before_script:
    - apk add --no-cache bash nodejs npm python3
    - node --version
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  script:
    - |
      set -eu
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        REF="refs/tags/$CI_COMMIT_TAG"
      else
        REF="refs/heads/$CI_COMMIT_BRANCH"
      fi
      node scripts/ci-common.mjs publish \
        --platform gitlab \
        --ref "$REF" \
        --revision "$CI_COMMIT_SHA" \
        --repository "$CI_REGISTRY_PATH"
