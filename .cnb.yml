# CI for the standalone terminal executor repository.
# Validation and publishing both live in scripts/ci-common.mjs, so CNB,
# GitHub Actions and GitLab CI stay aligned.
#
# Images are namespaced by this repository's CNB slug:
#   Executor: docker.cnb.cool/${CNB_REPO_SLUG_LOWERCASE}
#   Sandbox:  docker.cnb.cool/${CNB_REPO_SLUG_LOWERCASE}/sandbox
#
# Every job here runs Node, so every job pins node:24.15.0-bookworm.
# `services: [docker]` logs in to docker.cnb.cool automatically on trusted
# push/tag pipelines, so publish steps pass --no-login.
# Pull requests validate only; they never push images.

main:
  push:
    - name: verify
      docker: &node-runtime
        image: node:24.15.0-bookworm
      stages:
        - name: unit-tests
          script: node scripts/ci-common.mjs verify

    - name: publish-images
      docker: *node-runtime
      services:
        - docker
      stages:
        - name: build-and-push
          script: >-
            node scripts/ci-common.mjs publish
            --platform cnb
            --ref "refs/heads/${CNB_BRANCH}"
            --revision "$CNB_COMMIT"
            --repository "$CNB_REPO_SLUG_LOWERCASE"
            --no-login

  pull_request:
    - name: verify-pull-request
      docker: *node-runtime
      stages:
        - name: unit-tests
          script: node scripts/ci-common.mjs verify

"v*":
  tag_push:
    - name: publish-release-images
      docker: *node-runtime
      services:
        - docker
      stages:
        - name: build-and-push-tag
          script: >-
            node scripts/ci-common.mjs publish
            --platform cnb
            --ref "refs/tags/${CNB_BRANCH}"
            --revision "$CNB_COMMIT"
            --repository "$CNB_REPO_SLUG_LOWERCASE"
            --no-login
